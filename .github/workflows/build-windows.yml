name: Build Windows EXE

# PyInstaller cannot cross-compile: a Windows .exe must be built on Windows.
# This runs the build on a GitHub-hosted Windows runner and uploads the result.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Used by arityper_activated.py but not listed in requirements.txt
          pip install PyPDF2
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name AriTyper `
            --hidden-import pdfplumber `
            --hidden-import pdfminer `
            --hidden-import docx `
            --hidden-import PyPDF2 `
            --hidden-import pygetwindow `
            --hidden-import pyautogui `
            --hidden-import pyscreeze `
            --hidden-import pymsgbox `
            --hidden-import pytweening `
            --hidden-import mouseinfo `
            --exclude-module torch `
            --exclude-module tensorflow `
            --exclude-module pandas `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --exclude-module IPython `
            --exclude-module jupyter `
            --exclude-module pytest `
            arityper_activated.py

      - name: Smoke-check the build
        run: |
          if (-Not (Test-Path "dist/AriTyper/AriTyper.exe")) {
            Write-Error "AriTyper.exe was not produced"
            exit 1
          }
          Get-Item "dist/AriTyper/AriTyper.exe" | Format-List Name, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AriTyper-windows
          path: dist/AriTyper/
